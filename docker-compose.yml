version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: postgres-sre
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sre_db
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements 
      -c pg_stat_statements.track=all 
      -c max_connections=200
    volumes:
      - ./sample-db/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sample-db/seed/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./sample-db/docker/03_roles.sql:/docker-entrypoint-initdb.d/03_roles.sql
      - ./sample-db/docker/04_triggers.sql:/docker-entrypoint-initdb.d/04_triggers.sql

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: mcp-api
    ports:
      - "8080:8080"
    environment:
      - SRE_READ_DB_URL=postgresql://sre_read:sre_read_pass@postgres:5432/sre_db
      - SRE_OPS_DB_URL=postgresql://sre_ops:sre_ops_pass@postgres:5432/sre_db
    depends_on:
      - postgres

  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: mcp-server
    ports:
      - "8001:8001"
    environment:
      - API_BASE_URL=http://api:8080/api/v1
    depends_on:
      - api
