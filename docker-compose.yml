services:

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: mcp-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: mcp-server
    ports:
      - "8001:8001"
    environment:
      - API_BASE_URL=http://api:8080/api/v1
    depends_on:
      - api
